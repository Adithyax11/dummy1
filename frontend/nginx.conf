server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/orders -> ${GATEWAY_URL}/orders (the trailing slash strips /api)
    location /api/ {
        proxy_pass ${GATEWAY_URL}/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }
}